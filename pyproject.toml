[project]
name = "kenkufm-youtube-mcp"
version = "0.1.0"
description = "MCP server to control the YouTube web view inside Kenku FM via Chrome DevTools Protocol"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12.0",
  "websockets>=12.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
kenkufm-youtube-mcp = "kenkufm_youtube_mcp.__main__:main"
kenkufm-youtube-mcp-smoke = "kenkufm_youtube_mcp.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
